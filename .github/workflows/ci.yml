name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows_msvc17:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: 生成 CMakePresets.json
        run: ./generate_presets.bat

      - name: 查看所有预设
        run: cmake --list-presets

      - name: 配置 (Debug)
        run: cmake --preset msvc17-debug

      - name: 工作流 (Debug)
        run: cmake --workflow --preset workflow-msvc17-debug

      - name: 安装 (Debug)
        run: cmake --install build/msvc17-debug --config Debug

      - name: 配置 (Release)
        run: cmake --preset msvc17-release

      - name: 工作流 (Release)
        run: cmake --workflow --preset workflow-msvc17-release

      - name: 安装 (Release)
        run: cmake --install build/msvc17-release --config Release

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: packages/*.zip
          if-no-files-found: warn

      - name: 清理
        run: ./clean_all.bat

  ubuntu_gcc_11_4_0:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Ninja
        run: sudo apt update && sudo apt install -y ninja-build

      - name: 查看 GCC 版本
        run: |
          gcc --version
          g++ --version

      - name: 生成 CMakePresets.json
        run: ./generate_presets.sh
          
      - name: 查看所有预设
        run: cmake --list-presets

      - name: 配置 (Debug)
        run: cmake --preset gcc_11.4.0-debug

      - name: 工作流 (Debug)
        run: cmake --workflow --preset workflow-gcc_11.4.0-debug

      - name: 安装 (Debug)
        run: cmake --install build/gcc_11.4.0-debug

      - name: 配置 (Release)
        run: cmake --preset gcc_11.4.0-release

      - name: 工作流 (Release)
        run: cmake --workflow --preset workflow-gcc_11.4.0-release

      - name: 安装 (Release)
        run: cmake --install build/gcc_11.4.0-release

      - name: 上传压缩包
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: packages/*.tar.gz
          if-no-files-found: warn

      - name: 清理
        run: ./clean_all.sh
  